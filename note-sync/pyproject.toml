[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notesync"
version = "0.1.0"
description = "A small desktop app that keeps a notes folder synchronized through GitHub."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
notesync = "notesync.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notesync = ["web/*.html"]
